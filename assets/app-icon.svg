<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 32 32">
  <!-- Full-bleed tile with a bold ring that fills it, so it reads at taskbar size -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#5B5BD6"/>
  <circle cx="16" cy="16" r="9.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5"/>
  <circle cx="16" cy="16" r="9.6" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="60.3" stroke-dashoffset="19.5" transform="rotate(-90 16 16)"/>
</svg>
