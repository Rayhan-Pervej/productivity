  <circle cx="16" cy="16" r="12" fill="none" stroke="#A3A3FF" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="75.4" stroke-dashoffset="24" transform="rotate(-90 16 16)"/>
</svg>
